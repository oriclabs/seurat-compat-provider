[package]
name = "bl-seurat-provider"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/oriclabs/seurat-compat-provider"
description = "Process-isolated strict numeric provider for BioLang single-cell workflows"

[[bin]]
name = "bl-seurat-provider"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1

